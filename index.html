<style>
/* Layout: eine App mit zwei Sichten. Die Brücke bleibt als Zeitachse zwischen Schule und Eltern sichtbar. */
:root {
  --bg: #eef2f3; --surface: #ffffff; --fg: #14242b; --muted: #526671; --line: #cbd7db;
  --a: #123a5e; --a-soft: #e1e9f1; --on-a: #ffffff;
  --b: #c4161c; --b-soft: #fbe5e5; --on-b: #ffffff;
  --warn: #7c4900; --warn-soft: #fbeed6;
  --font-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Noto Sans Arabic", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101a1f; --surface: #18252b; --fg: #e7eff1; --muted: #9db0b8; --line: #2c3e46;
    --a: #8fbde6; --a-soft: #1b3346; --on-a: #0b2030;
    --b: #f29a9d; --b-soft: #431d20; --on-b: #2c0b0d;
    --warn: #f0bc6a; --warn-soft: #3a2b12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101a1f; --surface: #18252b; --fg: #e7eff1; --muted: #9db0b8; --line: #2c3e46;
  --a: #8fbde6; --a-soft: #1b3346; --on-a: #0b2030;
  --b: #f29a9d; --b-soft: #431d20; --on-b: #2c0b0d;
  --warn: #f0bc6a; --warn-soft: #3a2b12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--a); outline-offset: 2px; }
#app {
  max-width: 820px; margin-inline: auto; padding-block: 12px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.brand { font: 700 23px/1.1 var(--font-display); display: flex; align-items: center; gap: 10px; }
.brand img { width: 44px; height: auto; }
.start-logo { display: block; width: min(100%, 300px); margin-inline: auto; border-radius: 12px; background: #ffffff; }
.brand small { display: block; font: 400 14px/1.3 var(--font-body); color: var(--muted); margin-top: 3px; }
.switch { display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.switch button { border: 0; background: none; min-height: 40px; padding: 4px 14px; border-radius: 7px; font-weight: 700; color: var(--muted); }
.switch button[aria-pressed="true"] { background: var(--a); color: var(--on-a); }
.shell { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.shell.phone { max-width: 430px; margin-inline: auto; }
.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs.bottom { border-bottom: 0; border-top: 1px solid var(--line); }
.tabs button { flex: 1 1 0; min-width: 84px; min-height: 54px; padding: 6px; border: 0; background: none; color: var(--muted); font-weight: 700; font-size: 15px; }
.tabs button[aria-pressed="true"] { background: var(--a-soft); color: var(--fg); }
.plan-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.plan { border-collapse: collapse; min-width: 640px; width: 100%; font-size: 15px; table-layout: fixed; }
.plan th, .plan td { border: 1px solid var(--line); padding: 10px 8px; text-align: center; vertical-align: middle; height: 58px; overflow-wrap: anywhere; }
.plan thead th { background: var(--a-soft); font-weight: 700; }
.plan tbody th { font-weight: 700; font-variant-numeric: tabular-nums; }
.plan th:first-child { position: sticky; inset-inline-start: 0; width: 64px; background: var(--surface); z-index: 1; }
.plan thead th:first-child { background: var(--a-soft); }
.btn.menu-btn { width: 100%; min-height: 76px; font-size: 20px; text-align: start; }
.page { padding: 20px; min-height: 480px; display: flex; flex-direction: column; gap: 14px; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-weight: 700; }
h1 { font: 700 25px/1.2 var(--font-display); margin: 0; text-wrap: balance; }
h2 { font: 700 18px/1.25 var(--font-display); margin: 0; }
p { margin: 0; }
.btn { border: 1px solid var(--a); background: var(--surface); color: var(--a); border-radius: 8px; min-height: 48px; padding: 8px 16px; font-weight: 700; }
.btn.primary { background: var(--a); color: var(--on-a); }
.btn.warn { border-color: var(--warn); color: var(--warn); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.row > .grow { flex: 1 1 110px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-height: 46px; padding: 6px 13px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--a); border-color: var(--a); color: var(--on-a); }
.stack { display: flex; flex-direction: column; gap: 8px; }
.note { padding: 11px 14px; border-radius: 8px; background: var(--a-soft); font-weight: 600; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.card { padding: 14px; border-radius: 8px; border: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.card.soft { border: 0; background: var(--bg); }
.pick { width: 100%; text-align: start; background: var(--surface); }
.pick[aria-pressed="true"] { border: 2px solid var(--a); background: var(--a-soft); }
.big { font-weight: 700; font-size: 19px; }
.meta { color: var(--muted); font-size: 15px; }
.pill { align-self: flex-start; padding: 1px 10px; border-radius: 6px; font-size: 14px; font-weight: 700; background: var(--warn-soft); color: var(--warn); }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-weight: 700; }
input[type=text], input[type=password], input[type=date], select, textarea { width: 100%; padding: 11px; border: 1px solid var(--muted); border-radius: 8px; background: var(--surface); }
textarea { resize: vertical; white-space: pre-wrap; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
.pre { white-space: pre-wrap; }
/* Gesprächsbahnen: Schule links, Eltern rechts, Zeit in der Mitte */
.lanes { display: flex; flex-direction: column; gap: 10px; min-height: 120px; }
.turn { display: grid; grid-template-columns: minmax(0, 1fr) 62px minmax(0, 1fr); align-items: start; }
.stamp { grid-column: 2; grid-row: 1; text-align: center; font-size: 13px; color: var(--muted); padding-top: 10px; font-variant-numeric: tabular-nums; }
.entry { grid-row: 1; padding: 9px 12px; border-radius: 8px; min-width: 0; overflow-wrap: anywhere; }
.turn.a .entry { grid-column: 1; background: var(--a-soft); }
.turn.b .entry { grid-column: 3; background: var(--b-soft); }
.who { font-size: 14px; font-weight: 700; }
.turn.a .who { color: var(--a); }
.turn.b .who { color: var(--b); }
.trans { margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--line); }
.interim { min-height: 26px; color: var(--muted); font-style: italic; overflow-wrap: anywhere; }
.speak { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mic { border: 2px solid transparent; border-radius: 10px; min-height: 70px; padding: 8px; font-weight: 700; line-height: 1.25; }
.mic small { display: block; font-weight: 400; font-size: 14px; }
.mic.a { background: var(--a); color: var(--on-a); }
.mic.b { background: var(--b); color: var(--on-b); }
.mic[aria-pressed="true"] { background: var(--surface); color: var(--fg); border-color: var(--a); }
.mic:disabled { opacity: .6; cursor: not-allowed; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: min(92vw, 520px); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; z-index: 20; font-size: 15px; }
@media (max-width: 560px) {
  .turn { grid-template-columns: minmax(0, 1fr); }
  .stamp { display: none; }
  .turn.a .entry { grid-column: 1; margin-right: 24px; }
  .turn.b .entry { grid-column: 1; margin-left: 24px; }
}
</style>

      h('div', { class: 'stamp', text: timeFmt.format(new Date(e.time)) }),
      h('div', { class: 'entry' }, kidsNodes)
    ]);
  }
  function micButton(side) {
    var active = listening === side, demo = !!playing;
    return h('button', {
      class: 'mic ' + side, type: 'button', id: 'mic-' + side, 'aria-pressed': active ? 'true' : 'false',
      disabled: demo || busy, onclick: function () { toggleListen(side); }
    }, [(side === 'a' ? 'Schule' : 'Eltern') + (active ? ' spricht' : ''), h('small', { text: active ? (demo ? 'hört zu' : 'Tippen zum Beenden') : langName(sideCode(side)) })]);
  }

  function talkView() {
    var noTrans = talkLang() === 'de';
    var out = [h('span', { class: 'pill', text: 'Pilot' })], t = talk(), risk = noTrans && t[2] !== 'high' && !kid().sign && !S.interp[S.kid] ? ['Nur Protokoll', 'Beide sprechen Deutsch, eine Übersetzung ist nicht nötig.', false] : kid().sign ? RISKS.sign : S.interp[S.kid] && t[2] !== 'sign' ? ['Dolmetscher nötig', 'Für diese Familie hat die Lehrperson künftig Dolmetscher festgelegt.', true] : RISKS[t[2]], code = talkLang(), T = D[code] || D.de;
    if (S.tStep === 'prep') {
      out.push(h('h1', { text: 'Gespräch vorbereiten' }));
      out.push(h('p', { text: kid().name + ', ' + kid().parent }));
      out.push(h('p', { id: 'talk-lang' }, ['Sprache automatisch aus der Registrierung: ', h('strong', { text: langName(code) })]));
      if (kid().help) out.push(h('p', { class: 'note warn', text: kid().helperOn ? 'Hilfe wegen Sprachbarriere: Hilfsperson ist hinterlegt.' : 'Hilfe wegen Sprachbarriere: keine Hilfsperson hinterlegt, bitte organisieren.' }));
      if (S.kid === 'yusuf' && S.talkAns) {
        out.push(h('p', { class: 'note' + (S.talkAns === 'yes' && (!helperNeeded() || S.talkHelper === 'ok') ? '' : ' warn'), id: 'talk-status', text: S.talkAns === 'no' ? 'Termin: Eltern haben abgesagt.' : !helperNeeded() ? 'Termin: Eltern haben zugesagt.' : S.talkHelper === 'ok' ? 'Termin: Eltern und Hilfsperson haben zugesagt.' : 'Termin: Eltern haben zugesagt, Hilfsperson steht noch aus.' }));
      }
      if (kid().companion) out.push(h('p', { class: 'note ' + (risk[2] ? 'warn' : ''), text: risk[2] ? 'Eine bekannte Person kommt mit, ersetzt bei diesem Gespräch aber keine Dolmetscher.' : 'Eine bekannte erwachsene Person kommt mit und kann unterstützen.' }));
      if (S.kid === 'yusuf' && S.pickHelper && S.pickState !== 'wait') {
        var helperName = HELPERS.filter(function (x) { return x.id === S.pickHelper; })[0].name;
        out.push(h('div', { class: 'card stack', id: 'helper-request' }, [
          h('h2', { text: 'Hilfsperson: ' + helperName }),
          h('p', { text: 'Von den Eltern gewählt. Zusage im Chat erteilt, Schweigepflicht bestätigt, nicht aus derselben Klasse.' }),
          risk[2] ? h('p', { class: 'note warn', text: 'Bei diesem Gespräch nicht möglich.' })
            : S.pickState === 'conf' ? h('p', { class: 'note', role: 'status', text: 'Von der Lehrperson bestätigt.' })
            : S.pickState === 'no' ? h('p', { class: 'note warn', role: 'status', text: 'Abgelehnt. Die Eltern können neu wählen.' })
            : h('div', { class: 'row' }, [
              btn('Bestätigen', 'primary', function () { set({ pickState: 'conf' }); }, { id: 'helper-confirm' }),
              btn('Ablehnen', '', function () { set({ pickState: 'no' }); }, { id: 'helper-decline' })
            ])
        ]));
      }
      out.push(h('div', { class: 'row' }, TALKS.map(function (x) { return chip(x[1], S.talk === x[0], function () { set({ talk: x[0] }); }); })));
      out.push(h('div', { class: 'note ' + (risk[2] ? 'warn' : '') }, [h('div', { text: risk[0] }), h('div', { style: 'font-weight:400', text: risk[1] })]));
      if ((t[2] === 'mid' || t[2] === 'low') && !noTrans) out.push(h('div', {}, [interpChip()]));
      var inv = S.invites[S.kid];
      var released = HELPERS.filter(function (x) { return S.release[x.id] && S.helpState[x.id] === 'ok'; });
      var helperText = S.kid !== 'yusuf' ? (kid().helperOn ? 'Hilfsperson hinterlegt' : 'Keine Hilfsperson')
        : S.pickHelper ? HELPERS.filter(function (x) { return x.id === S.pickHelper; })[0].name + ', freigegeben'
        : released.length ? released[0].name + ', freigegeben'
        : S.helperOn ? 'Hilfsperson hinterlegt' : 'Keine freigegebene Hilfsperson';
      var inviteNodes = [h('h2', { text: 'Termin und Einladung' }), h('p', { id: 'invite-helper', text: 'Hilfsperson: ' + helperText })];
      if (!inv) {
        inviteNodes.push(h('div', { class: 'two' }, [
          h('div', { class: 'field' }, [h('label', { for: 'invite-date', text: 'Datum' }), h('input', { type: 'date', id: 'invite-date', value: S.inviteDate, oninput: function (e) { S.inviteDate = e.target.value; } })]),
          h('div', { class: 'field' }, [h('label', { for: 'invite-time', text: 'Zeit' }), h('input', { type: 'time', id: 'invite-time', value: S.inviteTime, oninput: function (e) { S.inviteTime = e.target.value; } })])
        ]));
        inviteNodes.push(h('div', {}, [btn('Einladung senden', 'primary', function () {
          if (!S.inviteDate || !S.inviteTime) { toast('Bitte Datum und Zeit eingeben.'); return; }
          if (S.kid === 'yusuf' && !S.pickHelper && released.length) { S.pickHelper = released[0].id; S.pickState = 'ok'; }
          S.invites[S.kid] = { date: S.inviteDate, time: S.inviteTime, type: t[1] };
          render();
        }, { id: 'send-invite' })]));
      } else {
        inviteNodes.push(h('p', { class: 'note', role: 'status', id: 'invite-status', text: 'Einladung gesendet: ' + inv.type + ', ' + inviteDateText(inv, 'de-CH') + ' Uhr' }));
      }
      out.push(h('div', { class: 'card stack', id: 'invite-card' }, inviteNodes));
      if (!risk[2] && inv) out.push(h('div', {}, [btn('Weiter zur Einwilligung', 'primary', function () { set({ tStep: 'consent', trans: noTrans ? 'ok' : '', consent: '' }); }, { id: 'to-consent' })]));
    } else if (S.tStep === 'consent') {
      out.push(h('h1', { text: 'Information und Einwilligung' }));
      out.push(h('div', { class: 'card soft stack', dir: T.dir, lang: code }, [noTrans ? null : h('p', { text: T.c1 }), h('p', { text: T.c2 }), h('p', { text: T.c3 }), h('p', { text: T.c4 })]));
      if (!noTrans) {
        out.push(h('h2', { text: 'Teil 1: Live-Übersetzung' }));
        out.push(h('div', { class: 'row' }, [
          chip('Verstanden · ' + T.ok, S.trans === 'ok', function () { set({ trans: 'ok' }); }),
          chip('Abgelehnt · ' + T.refuse, S.trans === 'nein', function () { set({ trans: 'nein' }); })
        ]));
      }
      if (S.trans === 'nein') out.push(h('p', { class: 'note warn', text: 'Die Schule entscheidet über die Alternative, zum Beispiel Telefon- oder Videodolmetschen oder eine mitgebrachte Person.' }));
      out.push(h('h2', { text: noTrans ? 'Protokollentwurf' : 'Teil 2: Protokollentwurf' }));
      out.push(h('div', { class: 'row' }, [
        chip('Einverstanden · ' + T.agree, S.consent === 'ja', function () { set({ consent: 'ja' }); }),
        chip('Nicht einverstanden · ' + T.decline, S.consent === 'nein', function () { set({ consent: 'nein' }); })
      ]));
      if (S.consent === 'nein') out.push(h('p', { class: 'note warn', text: 'Kein KI-Protokoll. Die Lehrperson schreibt das Protokoll selbst.' }));
      if (S.trans === 'ok' && S.consent) out.push(h('div', {}, [btn('Gespräch starten', 'primary', function () { prepareLocal(code); set({ tStep: 'live', entries: [], fromExample: false, interpreter: false }); }, { id: 'start-talk' })]));
    } else if (S.tStep === 'live') {
      out.push(h('h1', { text: 'Live-Gespräch' }));
      out.push(h('p', { class: 'meta', text: kid().name + ' · ' + t[1] + ' · ' + (noTrans ? 'Nur Protokoll, Deutsch' : 'Deutsch und ' + langName(code)) }));
      if (S.consent === 'ja') out.push(h('p', { style: 'font-weight:700', text: 'Gesprächstext wird für den Protokollentwurf aufgezeichnet.' }));
      var lanes = h('div', { class: 'lanes', id: 'lanes' }, S.entries.map(turnRow));
      if (!S.entries.length && !playing) lanes.appendChild(h('p', { class: 'meta', text: 'Tippe auf «Schule» oder «Eltern» und sprich. Tippe nochmals, wenn der Beitrag fertig ist.' }));
      out.push(lanes, h('div', { class: 'interim', id: 'interim', 'aria-live': 'polite' }));
      out.push(h('div', { class: 'speak' }, [micButton('a'), micButton('b')]));
      var acts = [];
      if (playing) {
        if (!playing.fast) acts.push(btn('Schneller', 'primary', fastExample, { id: 'fast-example' }));
        acts.push(btn('Beispiel stoppen', '', stopExample, { id: 'stop-example' }));
      } else {
        if (D[code] && !S.entries.length) acts.push(btn('Beispiel abspielen', 'primary', playExample, { id: 'play-example' }));
        if (S.entries.length) acts.push(btn('Gespräch beenden', 'primary', endTalk, { id: 'end-talk', disabled: busy || !!listening }));
      }
      if (busy) acts.push(h('span', { class: 'meta', role: 'status', text: 'Wird übersetzt …' }));
      out.push(h('div', { class: 'row', style: 'align-items:center' }, acts));
    } else if (S.tStep === 'review') {
      out.push(h('h1', { text: 'Protokollentwurf' }));
      out.push(h('p', { class: 'note warn', text: S.fromExample
        ? 'Vorbereitetes Beispiel. In der fertigen Lösung erstellt eine KI diesen Entwurf.'
        : 'Erstelle die Zusammenfassung mit KI oder korrigiere den Gesprächsverlauf direkt.' }));
      if (!S.fromExample) {
        out.push(h('div', { class: 'row' }, [
          btn(sumBusy ? 'KI arbeitet …' : 'KI-Zusammenfassung erstellen', 'primary', summarizeTalk, { id: 'ai-summary', disabled: sumBusy }),
          btn('Gesprächstext kopieren', '', copyTalk, { id: 'copy-talk' })
        ]));
      }
      out.push(h('div', { class: 'field' }, [
        h('label', { for: 'review-text', text: 'Prüfen und korrigieren' }),
        h('textarea', { id: 'review-text', rows: '14', value: S.review, oninput: function (e) { S.review = e.target.value; } })
      ]));
      out.push(h('div', { class: 'row', style: 'align-items:center' }, [
        btn('Freigeben', 'primary', release, { id: 'release', disabled: busy }),
        busy ? h('span', { class: 'meta', role: 'status', text: 'Wird übersetzt …' }) : null
      ]));
    } else if (S.tStep === 'manual') {
      out.push(h('h1', { text: 'Gespräch beendet' }));
      out.push(h('p', { class: 'note warn', text: 'Kein KI-Entwurf: Die Lehrperson schreibt das Protokoll selbst.' }));
      out.push(h('div', {}, [btn('Neues Gespräch', 'primary', resetTalk)]));
      out.push(h('p', { class: 'meta', text: 'Blieb etwas unklar oder war es zu umständlich? Dann ein Folgegespräch mit Dolmetscher ansetzen.' }));
      out.push(h('div', {}, [interpChip()]));
    } else {
      out.push(h('h1', { text: 'Freigegeben' }));
      out.push(h('p', { class: 'note', role: 'status', text: 'Das Protokoll liegt in der App, für Eltern und Lehrperson in beiden Sprachen. Der Gesprächstext wurde gelöscht.' }));
      out.push(h('div', { class: 'row' }, [
        btn('Protokoll ansehen', 'primary', function () { resetTalk(); set({ tTab: 'prot' }); }, { id: 'see-prot' }),
        btn('Neues Gespräch', '', resetTalk)
      ]));
      out.push(h('p', { class: 'meta', text: 'Blieb etwas unklar oder war es zu umständlich? Dann ein Folgegespräch mit Dolmetscher ansetzen.' }));
      out.push(h('div', {}, [interpChip()]));
    }
    return out;
  }

  function sendThread(p, side) {
    var box = document.getElementById('thread-' + p.id);
    var text = box ? box.value.trim() : '';
    if (!text) return;
    p.thread = p.thread || [];
    var entry = { side: side, text: text, trans: '' };
    p.thread.push(entry);
    store('gba.protocols', protocols);
    render();
    if (p.lang === 'de') return;
    translate(text, side === 'parent' ? p.lang : 'de', side === 'parent' ? 'de' : p.lang).then(function (r) {
      if (r.text) { entry.trans = r.text; store('gba.protocols', protocols); render(); }
    });
  }
  function protThread(p, side, label, sendText) {
    var log = (p.thread || []).map(function (m) {
      return h('div', { class: 'card ' + (m.side === side ? '' : 'soft') }, [
        h('div', { class: 'who', dir: 'ltr', text: m.side === 'parent' ? p.parent : 'Lehrperson' }),
        h('div', { dir: 'auto', text: m.text }),
        m.trans ? h('div', { class: 'trans', dir: 'auto', text: m.trans }) : null
      ]);
    });
    return h('div', { class: 'stack', id: 'thread-box-' + p.id }, log.concat([
      h('div', { class: 'field' }, [
        h('label', { for: 'thread-' + p.id, text: label }),
        h('textarea', { id: 'thread-' + p.id, rows: '2' })
      ]),
      btn(sendText, '', function () { sendThread(p, side); }, { id: 'thread-send-' + p.id })
    ]));
  }
  function followUp(p) {
    delete S.invites[p.kid];
    if (p.kid === 'yusuf') { S.talkPick = ''; S.talkAns = ''; S.talkHelper = ''; }
    set({ kid: p.kid, talkLang: '', tTab: 'talk', tStep: 'prep', talk: 'stand', trans: '', consent: '', entries: [], review: '', fromExample: false });
  }

  function protocolsView() {
    var out = [h('h1', { text: 'Protokolle' }), h('p', { class: 'meta', text: 'Für Eltern und Lehrperson in beiden Sprachen. Die Daten bleiben in dieser Testversion nur in diesem Browser.' })];
    protocols.forEach(function (p) {
      var open = S.openProt === p.id;
      var node = [h('button', {
        class: 'card pick', type: 'button', 'aria-expanded': open ? 'true' : 'false',
        onclick: function () { set({ openProt: open ? '' : p.id }); }
      }, [
        h('span', { class: 'big', style: 'display:block', text: p.kidName + ', ' + p.type }),
        h('span', { class: 'meta', style: 'display:block', text: dateFmt.format(new Date(p.date)) + ' · ' + langName(p.lang) + (p.example ? ' · Beispiel' : '') })
      ])];
      if (p.flag) {
        node.push(h('p', { class: 'note warn', text: 'Rückmeldung der Eltern: Etwas stimmt nicht. Bitte prüfen.' + (p.follow ? ' Die Eltern wünschen einen Folgetermin.' : '') }));
        node.push(protThread(p, 'teacher', 'Antwort an die Eltern', 'Senden'));
        node.push(h('div', {}, [btn('Folgetermin anlegen', 'primary', function () { followUp(p); }, { id: 'followup-' + p.id })]));
      }
      if (open) {
        node.push(h('div', { class: 'two' }, [
          h('div', { class: 'card soft' }, [h('h2', { text: 'Deutsch, verbindlich' }), h('div', { class: 'pre', text: p.de })]),
          p.lang === 'de' ? null : h('div', { class: 'card soft' }, [
            h('h2', { text: langName(p.lang) + ', maschinell' }),
            h('div', { class: 'pre', dir: dirOf(p.lang), lang: p.lang, text: p.tr || 'Übersetzung fehlt. Dafür braucht es den Google-Schlüssel.' })
          ])
        ]));
      }
      out.push(h('div', { class: 'stack' }, node));
    });
    return out;
  }

  function settingsView() {
    return [
      h('h1', { text: 'Einstellungen' }),
      h('div', { class: 'field' }, [
        h('label', { for: 'set-key', text: 'Google-Schlüssel (optional)' }),
        h('input', { type: 'password', id: 'set-key', value: settings.key, autocomplete: 'off', oninput: function (e) { settings.key = e.target.value.trim(); store('gba.settings', settings); } }),
        h('p', { class: 'meta', text: 'Ohne Schlüssel nutzt die App die eingebaute Chrome-Übersetzung und sonst den Gratis-Test-Dienst MyMemory. Ein Schlüssel bleibt nur in diesem Browser.' })
      ]),
      lastLocalError ? h('p', { id: 'local-error', class: 'meta', text: 'Grund von Chrome: ' + lastLocalError }) : null,
      h('p', { id: 'local-status', class: 'meta', text: 'translator' in window || 'Translator' in window ? 'Chrome-Übersetzung: in diesem Browser vorhanden.' : 'Chrome-Übersetzung: in diesem Browser nicht vorhanden. Verwende Chrome 138 oder neuer am Computer.' }),
      h('label', { for: 'set-read', style: 'display:flex;gap:10px' }, [
        h('input', { type: 'checkbox', id: 'set-read', checked: settings.readAloud, onchange: function (e) { settings.readAloud = e.target.checked; store('gba.settings', settings); } }),
        'Übersetzungen automatisch vorlesen'
      ]),
      h('p', { class: 'meta', text: Recognition ? 'Spracherkennung: in diesem Browser vorhanden.' : 'Spracherkennung: in diesem Browser nicht vorhanden. Verwende Chrome.' }),
      h('p', { class: 'note warn', text: 'Testversion: Bitte nur erfundene Inhalte verwenden. Die Spracherkennung läuft über Google oder Apple.' })
    ];
  }

  function teacherView() {
    var tabs = [['class', 'Klasse'], ['send', 'Nachricht'], ['talk', 'Gespräch'], ['prot', 'Protokolle'], ['set', 'Einstellungen']];
    var views = { 'class': classView, send: sendView, talk: talkView, prot: protocolsView, set: settingsView };
    return h('div', { class: 'shell' }, [
      h('nav', { class: 'tabs', 'aria-label': 'Bereiche' }, tabs.map(function (t) {
        return chip(t[1], S.tTab === t[0], function () { if (playing) stopExample(); set({ tTab: t[0] }); }, ' ');
      })),
      h('div', { class: 'page' }, views[S.tTab]())
    ]);
  }

  function render() {
    var app = document.getElementById('app');
    var active = document.activeElement && document.activeElement.id;
    app.textContent = '';
    app.appendChild(h('header', { class: 'top' }, [
      h('div', { class: 'brand' }, [h('img', { src: LOGO_MARK, alt: 'Logo Frag Fridolin' }), h('div', {}, ['Frag Fridolin', h('small', { text: 'Verbindet Schule und Eltern · Testversion mit erfundenen Daten' })])]),
      h('div', { class: 'switch', role: 'group', 'aria-label': 'Sicht wählen' }, [
        chip('Eltern', S.role === 'parent', function () { if (playing) stopExample(); set({ role: 'parent' }); }, ' '),
        chip('Lehrperson', S.role === 'teacher', function () { set({ role: 'teacher' }); }, ' ')
      ])
    ]));
    if (S.role === 'parent') {
      app.appendChild(h('div', { class: 'switch', id: 'family-switch', role: 'group', 'aria-label': 'Beispielfamilie', style: 'margin-bottom:12px;width:fit-content' }, [
        chip('Familie Amal', S.family === 'amal', function () { setFamily('amal'); }, ' '),
        chip('Familie Meier', S.family === 'meier', function () { setFamily('meier'); }, ' ')
      ]));
    }
    app.appendChild(S.role === 'parent' ? parentView() : teacherView());
    if (active) { var n = document.getElementById(active); if (n) n.focus(); }
  }
  render();
})();
</script>
